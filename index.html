<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ricorrenze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1c1b19;--muted:#6b6a66;--line:#e4e2dc;--accent:#1f6feb;--on-accent:#fff;--danger:#c93c37;--warn:#b7791f;--ok:#2f855a;--chip:#eceae4;--shadow:0 1px 2px rgba(0,0,0,.06);--late-bg:#fbe3e1;--soon-bg:#faecd2}
@media(prefers-color-scheme:dark){:root{--late-bg:#4a2220;--soon-bg:#47381a;--bg:#161615;--card:#212120;--text:#f1efe9;--muted:#a3a19a;--line:#33332f;--accent:#5b9bff;--on-accent:#0d1b33;--danger:#ff7b72;--warn:#e3b04b;--ok:#5fcf93;--chip:#2c2c2a;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:22px;font-weight:600;margin:0}
.top{display:flex;align-items:center;gap:8px;margin:4px 0 14px}
.top .sp{flex:1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;min-height:44px}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.dng{color:var(--danger)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.ibtn{border:0;background:transparent;font-size:14px;color:var(--muted);padding:8px;min-height:44px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.metric{background:var(--card);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.metric small{display:block;color:var(--muted);font-size:13px}
.metric b{font-size:22px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:7px 13px;font-size:14px;min-height:36px}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.sec{font-size:13px;color:var(--muted);margin:16px 2px 8px}
.card{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.card .main{flex:1;min-width:0;cursor:pointer}
.card .t{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.card .s{font-size:13px;color:var(--muted)}
.card .r{text-align:right;flex:none;white-space:nowrap}
.card .r b{display:block;font-size:15px}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff}
.c-casa{--cc:#c4742b}.c-auto{--cc:#3b82c4}.c-salute{--cc:#c0507a}.c-abbonamenti{--cc:#7a5cc4}.c-tasse{--cc:#5f6b73}.c-altro{--cc:#3d9a7a}
.av,.dot{background:var(--cc,#3d9a7a)}
.av.ring,.dot.ring{background:transparent;border:2.5px solid var(--cc,#3d9a7a);color:var(--cc,#3d9a7a)}
.late{color:var(--danger)}.soon{color:var(--warn)}
.u{font-family:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:14px;line-height:1.2}
.u.late{color:var(--danger)}.u.soon{color:var(--warn)}
.card.u-late{border-left:4px solid var(--danger)}
.card.u-soon{border-left:4px solid var(--warn)}
.card.u-far .t{color:var(--muted);font-weight:500}
.card.u-far .av{opacity:.6}
.tabs{display:flex;background:var(--chip);border-radius:10px;padding:3px;margin:0 0 12px}
.tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px;min-height:40px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin:6px 2px 10px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--cc)}
.lg i.ring{background:transparent;border:2px solid var(--text-ring,var(--muted));box-sizing:border-box}
.lg i.fill{background:var(--muted)}
.chart{background:var(--card);border-radius:12px;padding:12px;margin-bottom:6px;box-shadow:var(--shadow)}
.bars{display:flex;align-items:flex-end;gap:4px;height:114px;border-bottom:1px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column-reverse;align-items:stretch;gap:1px;border:0;background:transparent;padding:0;height:100%;justify-content:flex-start}
.bar span{display:block;border-radius:2px;background:var(--cc)}
.mths{display:flex;gap:4px;font-size:11px;color:var(--muted);margin-top:3px}
.mths span{flex:1;text-align:center}
.mths span.now{color:var(--text);font-weight:700}
.tl{position:relative;margin:4px 0 0 14px;padding-left:18px;border-left:2px solid var(--line)}
.tl .m{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:14px 0 2px;position:relative}
.tl .m b{color:var(--text);font-weight:600}
.it{position:relative;display:flex;justify-content:space-between;gap:10px;padding:7px 0;cursor:pointer}
.it .dot{position:absolute;left:-28px;top:11px;width:14px;height:14px;border-radius:50%;box-sizing:border-box}
.it .dot.late{box-shadow:0 0 0 3px var(--late-bg)}
.it .dot.soon{box-shadow:0 0 0 3px var(--soon-bg)}
.it .nm{font-size:15px;margin:0;line-height:1.3}
.it .sb{font-size:12px;color:var(--muted);margin:0}
.it .r{text-align:right;flex:none}
.it.far .nm,.it.far .sb{color:var(--muted)}
.it.far .dot{opacity:.75}
.done{border:1px solid var(--line);background:transparent;border-radius:50%;width:38px;height:38px;flex:none;font-size:18px;color:var(--ok)}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(20px + env(safe-area-inset-bottom));background:var(--accent);color:var(--on-accent);border:0;border-radius:28px;padding:0 22px;height:54px;font-weight:600;font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.banner{background:var(--card);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{font-size:18px;margin:0 0 6px;font-weight:600}
label.l{display:block;font-size:13px;color:var(--muted);margin:14px 0 4px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.hint{font-size:13px;color:var(--muted);margin:4px 0}
.err{color:var(--danger);font-size:14px;margin:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#222;color:#fff;border-radius:10px;padding:10px 14px;display:flex;gap:14px;align-items:center;z-index:20;font-size:14px;max-width:92vw}
.toast button{background:none;border:0;color:#8fc1ff;font-weight:600}
.login{max-width:380px;margin:12vh auto 0}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
